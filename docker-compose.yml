version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: job_tracker_db
    environment:
      POSTGRES_DB: job_tracker_db
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: fr001009
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: job_tracker_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_tracker_db
      SPRING_DATASOURCE_USERNAME: job_user
      SPRING_DATASOURCE_PASSWORD: fr001009
    depends_on:
      - postgres

volumes:
  postgres_data: